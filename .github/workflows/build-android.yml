name: Build Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      use_test_key:
        description: 'Sign with a throwaway key to smoke-test the pipeline. Artifacts are NOT published and cannot go to Play.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - 'manifest.json'
      - 'icons/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # The runner ships an Android SDK already; setup-android only re-fetches
      # it and fails on the retired 'tools' package. Writing the config up front
      # also stops Bubblewrap prompting to download its own JDK/SDK, which would
      # hang the run.
      - name: Configure Bubblewrap
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          ls "$SDK"
          # Bubblewrap accepts an SDK only if it has tools/ or bin/ at the root.
          # Current SDKs put those under cmdline-tools/<version>/bin instead, so
          # link the newest one into place.
          if [ ! -d "$SDK/bin" ] && [ ! -d "$SDK/tools" ]; then
            CMDLINE_BIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -1)
            if [ -z "$CMDLINE_BIN" ]; then
              echo "::error::No cmdline-tools/*/bin found under $SDK"
              exit 1
            fi
            echo "Linking $SDK/bin -> $CMDLINE_BIN"
            sudo ln -sfn "$CMDLINE_BIN" "$SDK/bin"
          fi
          ls -la "$SDK/bin" | head -3
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      # Pipeline smoke test and a usable APK before the real key exists. The
      # key lives and dies with the run, so nothing it signs can be shipped to
      # Play or upgraded in place later.
      - name: Generate throwaway keystore
        if: ${{ inputs.use_test_key }}
        run: |
          echo "::warning::Signing with a throwaway key - these artifacts are for testing the build only."
          keytool -genkeypair -v -keystore android.keystore -alias upload \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass testkey123 -keypass testkey123 \
            -dname "CN=Karakhana Test, O=Test, C=IN"
          echo "SIGNING_PASSWORD=testkey123" >> "$GITHUB_ENV"

      # The key itself is committed encrypted (see setup-signing.yml); only its
      # password is a secret.
      - name: Decrypt signing keystore
        if: ${{ !inputs.use_test_key }}
        env:
          RAW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ ! -f signing/upload-keystore.jks.enc ]; then
            echo "::error::Signing key abhi bani nahi hai. Pehle Actions -> 'Create signing key' chalaiye."
            exit 1
          fi
          export PW=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
               -in signing/upload-keystore.jks.enc -out android.keystore -pass env:PW 2>/dev/null \
             || ! keytool -list -keystore android.keystore -alias upload -storepass:env PW > /dev/null 2>&1; then
            rm -f android.keystore
            echo "::error::SIGNING_PASSWORD se key nahi khuli - secret mein wahi password hona chahiye jisse key bani thi."
            exit 1
          fi
          echo "::add-mask::$PW"
          # PKCS12 keystores share one password between store and key.
          echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "Keystore decrypted and verified."

      - name: Stamp version from run number
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersionCode = Number(process.env.GITHUB_RUN_NUMBER);
            m.appVersionName = "1.0." + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
            console.log("Building versionCode", m.appVersionCode, "/", m.appVersionName);
          '

      # Bubblewrap takes the launcher icons from the live site, so a build that
      # starts before GitHub Pages has deployed this commit would ship the old icon.
      - name: Wait for GitHub Pages to serve this commit's icon
        run: |
          url=$(node -p 'require("./twa-manifest.json").iconUrl')
          want=$(sha256sum icons/icon-512.png | cut -d" " -f1)
          for i in $(seq 1 45); do
            got=$(curl -fsSL "$url" | sha256sum | cut -d" " -f1)
            if [ "$got" = "$want" ]; then echo "Live icon matches this commit."; exit 0; fi
            echo "Pages is still serving an older icon ($i/45), waiting 20s..."
            sleep 20
          done
          echo "::warning::Live icon still differs after 15 minutes - the build may carry an older icon. Re-run once Pages has deployed."

      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade

      - name: Build APK and AAB
        run: |
          BUBBLEWRAP_KEYSTORE_PASSWORD="$SIGNING_PASSWORD" \
          BUBBLEWRAP_KEY_PASSWORD="$SIGNING_PASSWORD" \
            bubblewrap build --skipPwaValidation

      - name: Show build output
        run: ls -la *.apk *.aab 2>/dev/null || (echo "No APK/AAB produced"; ls -la; exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.use_test_key && 'karakhana-android-TEST-KEY' || 'karakhana-android' }}
          path: |
            *.apk
            *.aab

      - name: Publish release
        if: ${{ !inputs.use_test_key }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls *.apk | head -1)
          aab=$(ls *.aab | head -1)
          cp "$apk" karakhana-manager.apk
          cp "$aab" karakhana-manager.aab
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest karakhana-manager.apk karakhana-manager.aab \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build ${{ github.run_number }} (APK + AAB)" \
            --notes "APK: phone par sidha install. AAB: Google Play Console par upload." \
            --latest

      # A throwaway-key APK is still useful for installing and using the app
      # before the real key is in place - the app itself is the website, so it
      # picks up every later change without a reinstall. It goes to its own
      # pre-release, APK only (a test-key AAB is useless to Play), so it can
      # never be mistaken for the "latest" store build.
      - name: Publish test APK
        if: ${{ inputs.use_test_key }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls *.apk | head -1)" karakhana-manager-TEST.apk
          gh release delete test-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create test-build karakhana-manager-TEST.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Test APK (build ${{ github.run_number }}) - Play Store ke liye nahi" \
            --notes "Phone pe install karke use kariye. Test key se signed hai: Play Store pe upload nahi hoga, aur upar browser ki address bar dikhegi. Pakki key lagne ke baad 'latest' release mein asli APK/AAB aayega." \
            --prerelease
