name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Written up front so Bubblewrap uses the runner's JDK/SDK instead of
      # prompting to download its own (prompts hang a CI run).
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the signing secrets before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          echo "Keystore restored ($(stat -c%s android.keystore) bytes)."

      - name: Stamp version from run number
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersionCode = Number(process.env.GITHUB_RUN_NUMBER);
            m.appVersionName = "1.0." + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
            console.log("Building versionCode", m.appVersionCode, "/", m.appVersionName);
          '

      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade

      - name: Build APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Show build output
        run: ls -la *.apk *.aab 2>/dev/null || (echo "No APK/AAB produced"; ls -la; exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: karakhana-android
          path: |
            *.apk
            *.aab

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls *.apk | head -1)
          aab=$(ls *.aab | head -1)
          cp "$apk" karakhana-manager.apk
          cp "$aab" karakhana-manager.aab
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest karakhana-manager.apk karakhana-manager.aab \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build ${{ github.run_number }} (APK + AAB)" \
            --notes "APK: phone par sidha install. AAB: Google Play Console par upload." \
            --latest
